- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Restart systemd service {{ systemd_service_name }}
  systemd:
    name: "{{ systemd_service_name }}"
    daemon_reload: true
    state: restarted
  when:
    - not systemd_service_timer_file
    - not systemd_service_timer_content
    - not systemd_service_timer_template
    - systemd_service_state == 'started'

- name: Start or stop systemd timer {{ systemd_service_name }}
  systemd:
    name: "{{ systemd_service_name }}.timer"
    daemon_reload: true
    state: "{{ systemd_service_state }}"
    enabled: "{{ true if systemd_service_state == 'started' else false }}"
